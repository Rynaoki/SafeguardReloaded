name: Release

# Packages the addon into an installable zip whenever a version tag is pushed.
# The archive contains a single SafeguardReloaded/ folder so it can be dropped
# straight into Interface/AddOns.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build addon zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p build/SafeguardReloaded
          # NpcDatabase.lua and ZoneDatabase.lua are kept in the repository for
          # reference but are not listed in any .toc, so shipping them would add
          # ~1.9 MB to every download for data the client never loads.
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude '.gitignore' \
                   --exclude 'build' \
                   --exclude 'NpcDatabase.lua' \
                   --exclude 'ZoneDatabase.lua' \
                   ./ build/SafeguardReloaded/
          (cd build && zip -r "../SafeguardReloaded-${version}.zip" SafeguardReloaded)
          echo "ASSET=SafeguardReloaded-${version}.zip" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          body_path: CHANGELOG.md
